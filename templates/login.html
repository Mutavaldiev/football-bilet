{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="form-card">
    <h1>Welcome Back!</h1>
    <p>Login to your account.</p>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="main-button"> Login</button>
    </form>

    <p>Don't have an account?
        <a href="{% url 'register' %}">Register</a>
    </p>
</div>
{% endblock %}
